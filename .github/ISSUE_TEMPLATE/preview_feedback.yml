name: Preview feedback
description: Share installation and workflow feedback from the Hydra preview
title: "[Preview]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Hydra. Feedback about confusing steps, missing guidance, and successful workflows is useful even when nothing crashed.
  - type: input
    id: version
    attributes:
      label: Hydra version
      description: Paste the output of `hydra --version`.
      placeholder: hydra 0.1.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Homebrew
        - GitHub release archive
        - Cargo from source
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and shell.
      placeholder: macOS 15 arm64, Zsh
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Area tested
      multiple: true
      options:
        - Homebrew installation or update
        - Project initialization
        - Head creation and inspection
        - Head opening or closing
        - Head removal or repair
        - Shell completions
        - Codex skill lifecycle
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Describe the goal, commands used, and outcome. Remove private data from examples.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was unclear or difficult?
  - type: textarea
    id: improvement
    attributes:
      label: What would improve the preview?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private source code, and unnecessary personal paths.
          required: true
