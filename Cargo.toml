[workspace]
members = [
    "crates/hydra-cli",
    "crates/hydra-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
