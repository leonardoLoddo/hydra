[workspace]
members = [
    "crates/hydra-cli",
    "crates/hydra-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = { version = "=4.6.4", features = ["unstable-dynamic"] }
ignore = "0.4.31"
reflink-copy = "0.1.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["formatting"] }
uuid = { version = "1.24.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
